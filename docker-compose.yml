version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: urcure-postgres
    restart: always
    environment:
      POSTGRES_USER: urcure_user
      POSTGRES_PASSWORD: urcure_secure_password_2026
      POSTGRES_DB: urcure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urcure-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://urcure_user:urcure_secure_password_2026@db:5432/urcure_db
      JWT_SECRET_KEY: urcure_obsidian_production_secret_key_2026
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urcure-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
